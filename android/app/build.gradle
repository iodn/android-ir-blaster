plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties

def dartDefines = [:]
(project.findProperty('dart-defines') ?: '').split(',').findAll { it }.each {
    def pair = new String(it.decodeBase64(), 'UTF-8').split('=', 2)
    if (pair.length == 2) dartDefines[pair[0]] = pair[1]
}
def playUpdates = dartDefines['IRBLASTER_DISTRIBUTION'] == 'play' ||
    dartDefines['IRBLASTER_HIDE_DONATIONS'] == 'true'
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') } && !playUpdates) {
    throw new GradleException('Play bundles require --dart-define=IRBLASTER_DISTRIBUTION=play')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "org.nslabs.ir_blaster"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.srcDirs += playUpdates ? 'src/playUpdates/kotlin' : 'src/directUpdates/kotlin'
        if (!playUpdates) main.res.srcDirs += 'src/directUpdates/res'
        if (!playUpdates) test.java.srcDirs += 'src/testDirectUpdates/kotlin'
        // Exercise the production receiver declarations in Robolectric tests.
        test.manifest.srcFile 'src/main/AndroidManifest.xml'
    }

    sourceSets.configureEach {
        if (playUpdates && name in ['debug', 'profile', 'release']) {
            manifest.srcFile 'src/playUpdates/AndroidManifest.xml'
        }
    }

    defaultConfig {
        applicationId "org.nslabs.ir_blaster"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resConfigs "en"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
    }

    packagingOptions {
        jniLibs {
            each { file ->
                if (file.name.endsWith('.so')) {
                    file.alignment = 16384 // 16 KB
                }
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

flutter {
    source '../..'
}

// F-Droid can remove this entire directory before scanning/building.
if (playUpdates) apply from: 'src/playUpdates/dependencies.gradle'
